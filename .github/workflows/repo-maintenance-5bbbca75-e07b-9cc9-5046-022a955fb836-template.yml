        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repo-maintenance-1820b411-4957-4194-9efe-b77bee0a74ee
          path: ${{ runner.temp }}/repo-maintenance-check.txt
          retention-days: 1
          if-no-files-found: error
