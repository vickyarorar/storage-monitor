# Managed by repository maintenance; version 3
name: Repository maintenance 1820b411-4957-4194-9efe-b77bee0a74ee
run-name: Repository maintenance 1820b411-4957-4194-9efe-b77bee0a74ee
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: repo-maintenance-1820b411-4957-4194-9efe-b77bee0a74ee
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify runner environment
        run: >
          set -euo pipefail

          { uname -s; git --version; node --version; df -Pk / | tail -1; test -d
